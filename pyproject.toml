[project]
name = "commute_dm"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "jupyterlab-freeze>=0.1.0",
  "jupyterlab>=4.5.6",
  "pydot",
  "boltons",
  "rpy2",
  "pybiomart>=0.2.0",
  "momapy-kb[neo4j]",
  "momapy[skia]",
  "pd2af",
  "fieldz-kb",
  "pylpg",
  "matplotlib>=3.10.9",
  "powerlaw",
  "scipy",
  "networkx>=3.4.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
momapy-kb = { path = "../../../code/momapy_kb", editable = true }
momapy = { path = "../../../code/momapy", editable = true }
fieldz-kb = { path = "../../../code/fieldz_kb", editable = true }
pylpg = { path = "../../../code/pylpg", editable = true }
pd2af = { path = "../../../code/pd2af", editable = true }

[dependency-groups]
dev = ["jupyter-ruff>=0.3.1", "pd2af"]
