[project]
name = "commute_dm"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "notebook>=7.1.2",
  "jupyterlab-freeze>=0.1.0",
  "neomodel>=5.4.3",
  "pybiomart>=0.2.0",
  "minervapy @ git+http://github.com/adrienrougny/minervapy.git",
  "pickleshare>=0.7.5",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
  "-e file:///home/rougny/code/cd2bel#egg=cd2bel",
  "-e file:///home/rougny/code/momapy_bel#egg=momapy-bel",
  "-e file:///home/rougny/code/neo4j_dm#egg=neo4j-dm",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
